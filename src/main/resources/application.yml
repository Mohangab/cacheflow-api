spring:
  application:
    name: cacheflow-api

  datasource:
    url: jdbc:h2:mem:cacheflow;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2s
      repositories:
        enabled: false

  cache:
    type: redis

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,caches,metrics
  endpoint:
    health:
      show-details: when_authorized
  info:
    env:
      enabled: true

info:
  app:
    name: CacheFlow API
    description: Spring Boot 3 + Redis product catalog cache demo
    author: Mohan Venkatesh Kola (Mohangab)

cacheflow:
  cache:
    products-ttl-seconds: ${CACHE_PRODUCTS_TTL:300}
    products-by-category-ttl-seconds: ${CACHE_CATEGORY_TTL:120}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

logging:
  level:
    com.mohan.cacheflow: INFO
    org.springframework.cache: INFO
