services:
  redis:
    image: redis:7-alpine
    container_name: cacheflow-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - cacheflow-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    container_name: cacheflow-api
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CACHE_PRODUCTS_TTL: 300
      CACHE_CATEGORY_TTL: 120
    depends_on:
      redis:
        condition: service_healthy

volumes:
  cacheflow-redis-data:
